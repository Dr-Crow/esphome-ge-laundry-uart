version: 2.1

jobs:
  validator-tests:
    docker:
      - image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Test source, placement and readiness boundaries
          command: python3 -m unittest discover -s ci -p 'test_*.py'

  inventory:
    docker:
      - image: cimg/python:3.13.2@sha256:cdd7d2937b04e0751ff13b7cba0b2afa9a3aa3bf85d977b5a207220582ca6eeb
    steps:
      - checkout
      - run:
          name: Inventory source and manufacturing availability
          command: python3 ci/validate.py inventory
      - store_artifacts:
          path: ci-artifacts
          destination: inventory

  native-board:
    parameters:
      stage:
        type: enum
        enum: [hardware, manufacturing, rules, release]
      revision:
        type: string
        default: all
    docker:
      - image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Native board validation and explicit gates
          command: python3 ci/validate.py << parameters.stage >> --revision << parameters.revision >>
      - store_artifacts:
          path: ci-artifacts
          destination: << parameters.stage >>-<< parameters.revision >>

  firmware:
    docker:
      - image: esphome/esphome:2026.9.1@sha256:4ad55931c0186d2910dc128526237acabb422a662697a4e8bb356d390a1332a1
    resource_class: large
    steps:
      - checkout
      - run:
          name: Compile every declared ESPHome profile
          command: python3 ci/validate.py firmware
          no_output_timeout: 20m
      - store_artifacts:
          path: ci-artifacts
          destination: firmware

workflows:
  validation:
    jobs:
      - validator-tests
      - inventory
      - native-board:
          name: native-hardware
          stage: hardware
      - native-board:
          name: manufacturing-parity
          stage: manufacturing
      - native-board:
          name: intended-netclass-audit
          stage: rules
      - native-board:
          name: release-readiness
          stage: release
      - firmware
