<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEA Adapter Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a one-screen review bench. Header carries the revision rail and the views;
   the stage (3D / schematic / renders) fills the left, an inspector column holds detail. */
:root{
  --bg:#eef1ee; --panel:#ffffff; --panel-2:#f6f8f6; --ink:#16201b; --ink-2:#3a4841; --muted:#69766f;
  --line:#d6ddd8; --accent:#b0602a; --accent-ink:#ffffff; --accent-soft:#f6e6da; --mask:#1e6b49;
  --stage:#e4e8e4; --paper:#fbfaf6;
  --good:#1f7a4d; --warn:#9a6a00; --bad:#b3261e; --info:#2d6aa6;
  --good-soft:#e2f2e8; --warn-soft:#f8eed2; --bad-soft:#f8e1df; --info-soft:#e1ecf7;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --panel:#151c19; --panel-2:#1a221f; --ink:#e4ebe7; --ink-2:#b8c3bd; --muted:#83918a;
  --line:#28332e; --accent:#e39457; --accent-ink:#1a0f07; --accent-soft:#3a281b; --mask:#45a87a;
  --stage:#0a0e0c; --paper:#f4f2ea;
  --good:#5cc48d; --warn:#e0b04a; --bad:#ef7a70; --info:#78aee6;
  --good-soft:#163326; --warn-soft:#382d12; --bad-soft:#3d1b19; --info-soft:#152a3f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --panel:#151c19; --panel-2:#1a221f; --ink:#e4ebe7; --ink-2:#b8c3bd; --muted:#83918a;
  --line:#28332e; --accent:#e39457; --accent-ink:#1a0f07; --accent-soft:#3a281b; --mask:#45a87a;
  --stage:#0a0e0c; --paper:#f4f2ea;
  --good:#5cc48d; --warn:#e0b04a; --bad:#ef7a70; --info:#78aee6;
  --good-soft:#163326; --warn-soft:#382d12; --bad-soft:#3d1b19; --info-soft:#152a3f; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px;flex:none}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font:600 17px/1.1 var(--f-label);letter-spacing:.02em;margin:0;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.revrail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;max-width:100%}
.revchip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;font:500 13px var(--f-label)}
.revchip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.st-candidate{background:var(--accent)} .st-blocked{background:var(--bad)} .st-superseded{background:var(--muted)}
.st-original{background:var(--info)} .st-pivot{background:var(--warn)}
nav.views{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.views button{border:0;background:none;padding:8px 12px 9px;cursor:pointer;font:600 13px var(--f-label);letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.views button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 11px/18px var(--f-mono);text-align:center;margin-left:4px}

/* main */
main{flex:1;min-height:0;display:flex}
.view{flex:1;min-height:0;min-width:0;display:flex}
.view[hidden]{display:none!important}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;flex:1;min-height:0}
.stagewrap{position:relative;min-width:0;min-height:0;background:var(--stage);overflow:hidden}
.stagewrap canvas{display:block;width:100%;height:100%;touch-action:none}
aside.insp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec h2,.sec h3{margin:0;font:600 15px/1.25 var(--f-label);letter-spacing:.02em;text-wrap:balance}
.scroll{overflow:auto;min-height:0;flex:1}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* toolbars over the stage */
.tb{position:absolute;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:2}
.tb.top{top:10px;left:10px;right:10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font:500 12px var(--f-label);letter-spacing:.03em;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button+button{border-left:1px solid var(--line)}
.ctl{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px 8px;font:500 12px var(--f-label);color:var(--ink-2)}
.ctl select,.ctl input[type=range]{background:transparent;border:0;font-size:12px}
.ctl select{max-width:150px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.layerpanel{position:absolute;left:10px;bottom:10px;z-index:2;padding:8px 10px;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 70px);overflow:auto;min-width:170px}
.layerpanel label{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);cursor:pointer;white-space:nowrap}
.sw{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.25)}
.legend{position:absolute;right:10px;bottom:10px;z-index:2;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:6px;width:max-content;max-width:min(320px,calc(100% - 16px));display:flex;flex-direction:column;gap:3px}
.tip .h{display:flex;gap:8px;align-items:baseline}.tip .h b{font:500 14px var(--f-mono)}.tip .h span{color:var(--ink-2)}
.tip .role{color:var(--ink)}.tip .sub{color:var(--muted);font-size:11.5px}.tip .cost{font:500 12px var(--f-mono);color:var(--accent)}
.tip .hint{color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:3px;margin-top:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:500 13px var(--f-label);letter-spacing:.05em;z-index:1;pointer-events:none}
.reflabel{font:500 10px var(--f-mono);color:#fff;background:rgba(10,14,12,.72);padding:0 3px;border-radius:2px;pointer-events:none;white-space:nowrap}

/* inspector content */
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted);font-family:var(--f-label);font-size:12px;letter-spacing:.03em}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.refbig{font:500 26px/1 var(--f-mono);letter-spacing:-.01em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font:600 11px/18px var(--f-label);letter-spacing:.04em;text-transform:uppercase;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:6px 11px;cursor:pointer;font:600 12px var(--f-label);letter-spacing:.03em;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.search{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:7px 10px}
.plist{display:flex;flex-direction:column}
/* board inspector: details stay put, only the parts list scrolls */
#bInsp{overflow:hidden}
#bSel{flex:none;max-height:60%;overflow:auto}
#bInsp > .sec:nth-child(2){flex:none}
#bList{flex:1;min-height:0;overflow:auto}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 16px;border:0;background:none;text-align:left;cursor:pointer;border-top:1px solid var(--line);font-size:13px}
.prow:hover{background:var(--panel-2)}
.prow[aria-current="true"]{background:var(--accent-soft)}
.prow .r{font:500 13px var(--f-mono)}
.prow .v{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{width:8px;height:8px;border-radius:2px;display:inline-block}
.nets{font:12px/1.6 var(--f-mono);color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:0 10px}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel-2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--panel-2)}

/* overview */
.hero{display:flex;flex-direction:column;gap:6px}
.hero h2{font:600 26px/1.15 var(--f-label);margin:0;letter-spacing:.01em;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:72ch}
.grid-revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.revcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;cursor:pointer;text-align:left;padding:0}
.revcard:hover{border-color:var(--ink-2)}
.revcard .thumb{aspect-ratio:99/48;background:var(--stage);display:grid;place-items:center;max-width:100%}
.revcard .thumb img{width:100%;height:100%;object-fit:contain}
.revcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.revcard .t{display:flex;align-items:center;gap:8px;font:600 16px var(--f-label)}
.revcard .s{font-size:12.5px;color:var(--ink-2)}
.stats{display:flex;gap:12px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.feed{display:flex;flex-direction:column;gap:10px}
.feed .it{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:13px}
.feed .it .d{font:12px var(--f-mono);color:var(--muted)}
.feed .it b{font-weight:600}

/* compare */
.cmpbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cmpbar select{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 8px}
.renders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.renders figure{margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--stage)}
.renders figcaption{padding:6px 10px;font:600 12px var(--f-label);background:var(--panel);border-top:1px solid var(--line)}
.renders img{display:block;width:100%;aspect-ratio:99/48;object-fit:contain}
.chg-added{color:var(--good)} .chg-removed{color:var(--bad)} .chg-changed{color:var(--warn)} .chg-moved{color:var(--info)}

/* cost chart */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:18px;position:relative}
.bar .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 4px 4px 0;background:var(--accent)}
.bar .fill.est{background:transparent;border:2px solid var(--accent);border-left-width:0;background-image:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,transparent 4px 8px)}
.bar .fill.none{display:none}
.bar .val{text-align:right;font:500 13px var(--f-mono)}
.bar:hover .track{background:var(--panel-2)}
.axis{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:10px;font:11px var(--f-mono);color:var(--muted)}
.axis .ticks{position:relative;height:14px;border-top:1px solid var(--line)}
.axis .ticks span{position:absolute;top:2px;transform:translateX(-50%)}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.calc select{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile .big{font:500 22px/1.2 var(--f-mono)}
.tile .s{font-size:12px;color:var(--muted)}

/* docs */
.docs{display:grid;grid-template-columns:270px minmax(0,1fr);flex:1;min-height:0}
.docnav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 0 30px}
.docnav h4{margin:14px 16px 4px;font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.docnav button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 16px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.docnav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.docnav input{margin:0 16px 4px;width:calc(100% - 32px)}
.md{max-width:78ch;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.md h1{font:600 26px/1.2 var(--f-label);margin:0 0 .6em;text-wrap:balance}
.md h2{font:600 19px/1.25 var(--f-label);margin:1.6em 0 .5em;text-wrap:balance}
.md h3{font:600 16px/1.3 var(--f-label);margin:1.3em 0 .4em}
.md code{font:13px var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.md pre{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow:auto}
.md pre code{border:0;padding:0;background:none}
.md table{display:block;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin:1em 0}
.md img{max-width:100%;border:1px solid var(--line);border-radius:var(--r)}
.md blockquote{margin:1em 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md a.missing{color:var(--muted);text-decoration:underline dotted}
.dochead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-size:12px}

/* schematic */
.schwrap{position:absolute;inset:0;background:var(--paper);overflow:hidden;cursor:grab}
.schwrap img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.rendersview{position:absolute;inset:0;overflow:auto;padding:56px 16px 16px;display:grid;gap:14px;align-content:start}
.rendersview img{width:100%;max-width:1200px;justify-self:center;border-radius:var(--r)}

/* feedback */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,8,7,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog textarea{min-height:120px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:8px 10px;resize:vertical}
dialog select{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:6px 8px}
.fbitem{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fbitem .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.fbitem .txt{white-space:pre-wrap;font-size:14px}
.fbitem .reply{border-left:3px solid var(--accent);padding:4px 10px;background:var(--panel-2);font-size:13px;white-space:pre-wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--ink-2);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}

@media (max-width:900px){
  body{overflow:auto}
  main{display:block}
  .view{display:block}
  .split{display:flex;flex-direction:column}
  .stagewrap{height:62vh;min-height:360px}
  aside.insp{border-left:0;border-top:1px solid var(--line)}
  #bInsp{overflow:visible} #bSel{max-height:none} #bList{max-height:60vh}
  .docs{display:flex;flex-direction:column}
  .docnav{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  .two,.renders{grid-template-columns:1fr}
  .brand .sub{display:none}
  .layerpanel{min-width:0}
}
/* outside the Claude-hosted copy there is no feedback store: hide every feedback control */
.no-fb #fbNew,.no-fb [data-v="feedback"],.no-fb [data-fb],.no-fb #docFb,.no-fb #caseFb,.no-fb #cmpFb,.no-fb #costFb,.no-fb #ovFb{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.case-preview{display:block;width:100%;height:100%;object-fit:contain;background:#ecf1ef}.case-preview[hidden]{display:none}.compact-review{margin:0 0 1.25rem}.compact-review h3{margin:.6rem 0}.compact-review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.75rem}.compact-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}.compact-card h4{margin:0 0 .35rem;font-size:1.125rem}.compact-card p{margin:0 0 .65rem}.compact-card .row{gap:.45rem;flex-wrap:wrap}.compact-card a{text-decoration:none}.case-pickers{display:flex;flex-wrap:wrap;gap:.4rem}.case-dims{display:grid;grid-template-columns:auto 1fr;gap:.3rem .7rem;margin:.55rem 0;font-size:.9rem}.case-dims dt{color:var(--muted)}.case-dims dd{margin:0;font-variant-numeric:tabular-nums}
@media(max-width:680px){.compact-review-grid{grid-template-columns:1fr}.case-preview{min-height:220px}}
</style>

<header>
  <div class="hrow">
    <div class="brand"><h1>GEA Adapter Review</h1><span class="sub">GE appliance service-port carrier · XIAO ESP32-C3/C6 · every revision, case, cost and doc</span></div>
    <button class="btn" id="fbNew" type="button">Leave feedback</button>
  </div>
  <div class="hrow"><div class="revrail" id="revrail" role="toolbar" aria-label="Revisions"></div></div>
  <nav class="views" id="views" aria-label="Views">
    <button data-v="overview" type="button">Overview</button>
    <button data-v="board" type="button">Board</button>
    <button data-v="compare" type="button">Compare</button>
    <button data-v="cost" type="button">Cost</button>
    <button data-v="case" type="button">Case</button>
    <button data-v="docs" type="button">Docs</button>
    <button data-v="feedback" type="button">Feedback<span class="badge" id="fbCount" hidden>0</span></button>
  </nav>
</header>

<main>
  <!-- OVERVIEW -->
  <section class="view" id="v-overview"><div class="scroll pad"><div class="page" id="ovPage">
    <div class="hero"><h2>GE appliance adapter revisions</h2><p>Loading revisions…</p></div>
  </div></div></section>

  <!-- BOARD -->
  <section class="view" id="v-board" hidden>
    <div class="split">
      <div class="stagewrap" id="bStageWrap">
        <div class="tb top">
          <div class="seg" id="bMode" role="group" aria-label="Display">
            <button data-m="3d" aria-pressed="true" type="button">3D</button>
            <button data-m="sch" type="button">Schematic</button>
            <button data-m="renders" type="button">Renders</button>
          </div>
          <div class="seg" id="bLook" role="group" aria-label="3D look">
            <button data-l="assembled" aria-pressed="true" type="button">Assembled</button>
            <button data-l="layers" type="button">Layers</button>
            <button data-l="xray" type="button">X-ray</button>
          </div>
          <div class="seg" id="bCam" role="group" aria-label="Camera">
            <button data-c="iso" type="button">3/4</button>
            <button data-c="top" type="button">Top</button>
            <button data-c="bottom" type="button">Bottom</button>
          </div>
          <label class="ctl" id="bExplodeCtl" hidden>Explode <input id="bExplode" type="range" min="0" max="1" step="0.01" value="0.35"></label>
          <label class="ctl"><input id="bLabels" type="checkbox"> Refs</label>
          <label class="ctl">Diff vs <select id="bDiff"><option value="">none</option></select></label>
        </div>
        <canvas id="bCanvas"></canvas>
        <div class="layerpanel card" id="bLayers" hidden></div>
        <div class="legend card" id="bLegend" hidden></div>
        <div class="tip" id="bTip" hidden></div>
        <div class="loading" id="bLoading">Loading board…</div>
        <div class="schwrap" id="bSch" hidden></div>
        <div class="rendersview" id="bRenders" hidden></div>
      </div>
      <aside class="insp" id="bInsp">
        <div class="sec" id="bSel"></div>
        <div class="sec"><input class="search" id="bSearch" type="search" placeholder="Find part: ref, value, LCSC, net…" aria-label="Find part"></div>
        <div class="plist" id="bList"></div>
      </aside>
    </div>
  </section>

  <!-- COMPARE -->
  <section class="view" id="v-compare" hidden><div class="scroll pad"><div class="page" id="cmpPage"></div></div></section>

  <!-- COST -->
  <section class="view" id="v-cost" hidden><div class="scroll pad"><div class="page" id="costPage"></div></div></section>

  <!-- CASE -->
  <section class="view" id="v-case" hidden>
    <div class="split">
      <div class="stagewrap">
        <div class="tb top">
          <div class="seg" id="cCam" role="group" aria-label="Camera">
            <button data-c="iso" type="button">3/4</button>
            <button data-c="top" type="button">Top</button>
            <button data-c="side" type="button">Side</button>
            <button data-c="end" type="button">USB end</button>
            <button data-c="rjend" type="button">RJ45 end</button>
            <button data-c="bottom" type="button">Bottom</button>
          </div>
          <label class="ctl" id="cWhipCtl" hidden>Antenna <select id="cWhip"></select></label>
          <label class="ctl" id="cMagCtl" hidden>Magnets <select id="cMagnets"><option value="">None</option></select></label>
          <label class="ctl">Lid opacity <input id="cOpacity" type="range" min="0.08" max="1" step="0.01" value="0.35"></label>
          <label class="ctl">Explode <input id="cExplode" type="range" min="0" max="1" step="0.01" value="0"></label>
          <label class="ctl"><input id="cBoard" type="checkbox" checked> Board inside</label>
        </div>
        <canvas id="cCanvas"></canvas><img id="cPreview" class="case-preview" alt="" hidden>
        <div class="tip" id="cTip" hidden></div>
        <div class="loading" id="cLoading">Loading case…</div>
      </div>
      <aside class="insp" id="cInsp"></aside>
    </div>
  </section>

  <!-- DOCS -->
  <section class="view" id="v-docs" hidden>
    <div class="docs">
      <div class="docnav" id="docNav"></div>
      <div class="scroll pad"><div id="docBody"></div></div>
    </div>
  </section>

  <!-- FEEDBACK -->
  <section class="view" id="v-feedback" hidden><div class="scroll pad"><div class="page" id="fbPage"></div></div></section>
</main>

<dialog id="fbDlg">
  <form id="fbForm" method="dialog">
    <h3 style="margin:0;font:600 17px var(--f-label)">Leave feedback</h3>
    <div class="note" id="fbCtx"></div>
    <label class="lbl" for="fbKind">Type</label>
    <select id="fbKind">
      <option value="issue">Issue / change request</option>
      <option value="question">Question</option>
      <option value="idea">Idea</option>
      <option value="approve">Looks good / approved</option>
    </select>
    <label class="lbl" for="fbText">Feedback</label>
    <textarea id="fbText" required placeholder="What should change, or what do you want checked?"></textarea>
    <div class="muted" id="fbAvail" style="font-size:12px"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" type="button" id="fbCancel">Cancel</button>
      <button class="btn primary" type="submit" id="fbSave">Save feedback</button>
    </div>
  </form>
</dialog>

/* ---------- boot ---------- */

    getJSON('data/revisions.json?atlas=018d83ee', []), getJSON('data/pricing.json', null), getJSON('data/cases.json?atlas=compact-cases-018d83ee', []),

/* ---------- routing (#view-arg) ---------- */

  if (view === 'cost') h += '-' + slug(arg || S.cur);

    const prev = S.cases.find(c => c.id === S.caseId);
    const chosen = arg || (prev?.revisions?.includes(S.cur) ? prev.id : S.byId[S.cur]?.case) || S.caseId;
    if (chosen) h += '-' + slug(chosen);

const PROXY_MAT = new THREE.MeshStandardMaterial({ color: 0x3b3f42, roughness: 0.6, metalness: 0.1, transparent: true, opacity: 0.92 });

      $$('#bMode button').forEach(b => b.onclick = () => setMode(b.dataset.m));

    const id = S.cur; B.rev = id; B.sel = null;
    const data = await loadRev(id); if (S.cur !== id) return;

/* diff between two revisions, keyed by reference */
function diffParts(A, Bp) {

    const ch = []; if ((o.value || '') !== (p.value || '')) ch.push(`value ${o.value} → ${p.value}`); if ((o.lcsc || '') !== (p.lcsc || '')) ch.push(`LCSC ${o.lcsc || '—'} → ${p.lcsc || '—'}`); if ((o.footprint || '') !== (p.footprint || '')) ch.push('footprint changed');
    if (ch.length) { status[p.ref] = { kind: 'changed', detail: ch.join('; ') }; continue; }
    const mv = Math.hypot(o.x - p.x, o.y - p.y); if (mv > 0.25 || Math.abs((o.rot || 0) - (p.rot || 0)) > 0.5) status[p.ref] = { kind: 'moved', detail: `moved ${mv.toFixed(2)} mm${Math.abs((o.rot || 0) - (p.rot || 0)) > 0.5 ? ', rotated' : ''}` };
  }

  return { status, removed };
}

   ${(() => { const st = $('#cMagnets')?.value; const p = (cs.parts || []).find(q => q.magnet_style && q.magnet_style === st); return p ? `<div class="note"><b>Magnets: ${esc(p.magnet_label)}.</b> ${esc(p.note || '')} Four N52 8 × 2 mm discs; 6 × 2 and 10 × 2 are also available from the CAD (<span class="mono">--magnets</span>). Stick-on magnet tape on a plain base works too, with no reprint.</div>` : ''; })()}
   ${bp.map ? `<details><summary class="lbl" style="cursor:pointer">How the board is placed</summary><div class="muted" style="font-size:12.5px;margin-top:6px">${esc(bp.map)}</div></details>` : ''}</div>
   <div class="sec"><div class="lbl">Pieces</div><div class="tw"><table><thead><tr><th></th><th>Piece</th><th class="n">Print time</th><th class="n">Filament</th><th class="n">Grams</th></tr></thead><tbody>
   ${(cs.parts || []).map((p, i) => `<tr><td><input type="checkbox" data-i="${i}" checked ${C.flat ? 'disabled' : ''} aria-label="Show ${esc(p.name)}"></td><td>${esc(p.name)} <span class="muted">${esc(p.role)}</span></td><td class="n">${esc(p.print?.time ?? '—')}</td><td class="n">${p.print?.filament_m != null ? (+p.print.filament_m).toFixed(2) + ' m' : '—'}</td><td class="n">${p.print?.grams != null ? (+p.print.grams).toFixed(0) : '—'}</td></tr>`).join('')}</tbody></table></div></div>
   ${cs.params ? `<div class="sec"><details><summary class="lbl" style="cursor:pointer">Export parameters</summary><pre class="mono" style="font-size:11.5px;white-space:pre-wrap;margin:8px 0 0">${esc(JSON.stringify(cs.params, null, 1))}</pre></details></div>` : ''}
   ${(cs.source_files || []).length ? `<div class="sec"><div class="lbl">Sources</div><div class="mono" style="font-size:11.5px;overflow-wrap:anywhere">${cs.source_files.map(f=>esc(typeof f==='string' ? f : f.path)).join('<br>')}</div></div>` : ''}
   <div class="sec"><div class="row"><button class="btn primary" type="button" id="caseFb">Feedback on ${esc(cs.label)}</button>${!cs.compact_revision && S.docs.find(d => /case\/rev3c\/analytical\/README/.test(d.path)) ? '<button class="btn" type="button" id="caseDoc">Case README</button>' : ''}</div></div>`;
  $$('[data-case]', el).forEach(b => b.onclick = () => go('case', b.dataset.case));
  $$('input[data-i]', el).forEach(i => i.onchange = () => { const g = C.parts.find(g => g.userData.part === cs.parts[+i.dataset.i]); if (g) { g.userData.on = i.checked; caseLook(); } });
  $('#caseFb').onclick = () => openFeedback({ rev: (cs.revisions || [])[0] || null, view: 'case', target: { type: 'case', id: cs.id, label: cs.label } });
  $('#caseDoc')?.addEventListener('click', () => go('docs', S.docs.find(d => /case\/rev3c\/analytical\/README/.test(d.path)).id));
}

/* ---------- docs ---------- */
const docUrl = d => /^docs\//.test(d.path) ? d.path : 'docs/' + d.path;
const GROUPS = ['Plan & findings', 'Reddit drafts', 'Research', 'Revision docs', 'Case docs', 'Repo'];
async function showDocs(arg) {
  const nav = $('#docNav'); const q = (S.docQ || '').toLowerCase();
  const doc = S.docs.find(d => slug(d.id) === arg) || S.docs.find(d => d.id === S.docId) || S.docs.find(d => d.group === 'Plan & findings') || S.docs[0];
  if (!doc) { $('#docBody').innerHTML = '<div class="empty">No documents yet.</div>'; return; }
  S.docId = doc.id;
  const groups = [...GROUPS, ...new Set(S.docs.map(d => d.group).filter(g => !GROUPS.includes(g)))];
  nav.innerHTML = `<input class="search" id="docQ" type="search" placeholder="Filter docs" value="${esc(S.docQ || '')}" aria-label="Filter docs">` + groups.map(g => { const ds = S.docs.filter(d => d.group === g && (!q || (d.title + ' ' + d.path).toLowerCase().includes(q))); if (!ds.length) return '';
    return `<h4>${esc(g)}</h4>` + ds.map(d => `<button type="button" data-id="${esc(d.id)}" aria-current="${d.id === doc.id}">${d.rev ? `<span class="mono muted" style="font-size:11px">${esc(S.byId[d.rev]?.label || d.rev)}</span> ` : ''}${esc(d.title)}</button>`).join(''); }).join('');
  $('#docQ').oninput = e => { S.docQ = e.target.value; const pos = e.target.selectionStart; showDocs(slug(doc.id)).then(() => { const i = $('#docQ'); i.focus(); i.setSelectionRange(pos, pos); }); };
  $$('button[data-id]', nav).forEach(b => b.onclick = () => go('docs', b.dataset.id));
  const body = $('#docBody'); body.innerHTML = '<div class="muted">Loading…</div>';
  let txt; try { const r = await fetch(docUrl(doc)); if (!r.ok) throw 0; txt = await r.text(); } catch { body.innerHTML = '<div class="empty">Could not load this document.</div>'; return; }
  if (S.docId !== doc.id) return;
  const base = new URL(docUrl(doc), location.href);
  const html = /\.md$/i.test(doc.path) ? DOMPurify.sanitize(marked.parse(txt, { gfm: true })) : `<pre>${esc(txt)}</pre>`;
  body.innerHTML = `<div class="dochead"><span class="pill">${esc(doc.group)}</span><span class="mono">${esc(doc.source || doc.path)}</span><button class="btn" type="button" id="docFb">Feedback on this doc</button></div><article class="md">${html}</article>`;
  const byPath = new Map(S.docs.map(d => [new URL(docUrl(d), location.href).href.split('#')[0], d]));
  $$('article img', body).forEach(im => { const s = im.getAttribute('src'); if (s && !/^(https?:|data:)/.test(s)) im.src = new URL(s, base).href; im.loading = 'lazy'; im.onerror = () => { im.replaceWith(Object.assign(document.createElement('span'), { className: 'muted', textContent: `[image not included: ${s}]` })); }; });
  $$('article a', body).forEach(a => { const h = a.getAttribute('href'); if (!h || h.startsWith('#')) return; if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    const abs = new URL(h, base).href.split('#')[0]; const d = byPath.get(abs);
    if (d) a.onclick = e => { e.preventDefault(); go('docs', d.id); };
    else if (/\.(png|jpe?g|svg|pdf|gif|webp)$/i.test(abs)) { a.href = abs; a.target = '_blank'; }
    else { a.classList.add('missing'); a.title = 'Not included in the hub; see the repository'; a.onclick = e => { e.preventDefault(); toast('That file is in the repository, not in the hub.'); }; } });
  body.parentElement.scrollTop = 0;
  $('#docFb').onclick = () => openFeedback({ rev: doc.rev || null, view: 'docs', target: { type: 'doc', id: doc.id, label: doc.title } });
}

/* ---------- feedback (db) ---------- */
function currentContext() {
  const r = S.byId[S.cur];
  if (S.view === 'board' && B.sel) { const p = B.data?.partBy[B.sel]; return { rev: S.cur, view: 'board', target: { type: 'part', id: B.sel, label: `${B.sel} (${p?.value || ''})` } }; }
  if (S.view === 'board' && B.look !== 'assembled') return { rev: S.cur, view: 'board', target: { type: 'layers', id: Object.keys(B.layerOn || {}).filter(layerVisible).join(','), label: `${r?.label} layers` } };
  if (S.view === 'docs') { const d = S.docs.find(x => x.id === S.docId); return { rev: d?.rev || null, view: 'docs', target: { type: 'doc', id: d?.id, label: d?.title } }; }
  if (S.view === 'case') { const c = S.cases.find(x => x.id === S.caseId); return { rev: null, view: 'case', target: { type: 'case', id: c?.id, label: c?.label } }; }
  if (['board', 'cost', 'compare'].includes(S.view)) return { rev: S.cur, view: S.view, target: { type: 'revision', id: S.cur, label: r?.label } };
  return { rev: null, view: S.view, target: { type: 'general', id: 'general', label: 'General' } };
}
let fbCtx = null;
function openFeedback(ctx) {
  fbCtx = ctx; const r = S.byId[ctx.rev];
  $('#fbCtx').innerHTML = `<b>${esc(ctx.target?.label || 'General')}</b>${r ? ' · ' + esc(r.label) : ''} · <span class="muted">${esc(ctx.view)} view</span>`;
  $('#fbAvail').textContent = S.db ? 'Saved to this hub. The next Claude session reads it.' : 'Feedback is only available in the Claude-hosted copy of this hub. You can still copy your note.';
  $('#fbSave').textContent = S.db ? 'Save feedback' : 'Copy note';
  $('#fbText').value = store.get('draft', ''); $('#fbDlg').showModal(); $('#fbText').focus();
}
$('#fbText').addEventListener('input', e => store.set('draft', e.target.value));
$('#fbCancel').onclick = () => $('#fbDlg').close();
$('#fbForm').addEventListener('submit', async e => {
  e.preventDefault(); const text = $('#fbText').value.trim(); if (!text) return;
  const docBody = { text, kind: $('#fbKind').value, status: 'open', rev: fbCtx?.rev || null, view: fbCtx?.view || null, target: fbCtx?.target || null, created: new Date().toISOString(), author: S.uid || null, reply: null };
  if (!S.db) { const s = `[${docBody.kind}] ${docBody.target?.label || ''} (${S.byId[docBody.rev]?.label || 'general'}): ${text}`; try { await navigator.clipboard.writeText(s); toast('Copied. Paste it into the chat.'); } catch { toast('Copy failed. Select the text and copy it.'); return; } $('#fbDlg').close(); return; }
  $('#fbSave').disabled = true;
  try { await S.db.collection('feedback').add(docBody); store.set('draft', ''); $('#fbDlg').close(); toast('Feedback saved'); }
  catch (err) { toast(err?.code === 'quota_exceeded' ? 'The feedback store is full. Resolve or delete old items.' : 'Could not save. ' + (err?.message || 'Try again.')); }
  finally { $('#fbSave').disabled = false; }
});
function feedbackUnavailable() {  // static hosting or no store: hide feedback controls and settle the "Connecting…" placeholders
  S.fbReady = true; document.documentElement.classList.add('no-fb');
  if (S.view === 'feedback') showFeedback(); if (S.view === 'overview') showOverview();
}
async function initFeedbackStore() {
  if (!window.claude?.use) { feedbackUnavailable(); return; }
  let db, user;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { feedbackUnavailable(); return; }
  S.db = db; S.user = user; S.uid = user ? await user.id() : null;
  if (!db) { feedbackUnavailable(); return; }
  let timer = setTimeout(() => { S.fbSlow = true; if (S.view === 'feedback') showFeedback(); }, 10000);
  db.collection('feedback').orderBy('created', 'desc').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.fbSlow = false; }
    S.fb = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.fbReady = true; updateFbBadge();
    if (S.view === 'feedback') showFeedback(); if (S.view === 'overview') showOverview(); if (S.view === 'board') { renderPartList(); renderSel(); }
  }, err => { clearTimeout(timer); S.fbErr = err; S.fbReady = true; if (S.view === 'feedback') showFeedback(); });
}
function updateFbBadge() { const n = S.fb.filter(f => f.status !== 'resolved').length; $('#fbCount').textContent = n; $('#fbCount').hidden = !n; }
function showFeedback() {
  const el = $('#fbPage'); const filt = S.fbFilter || 'open';
  const list = S.fb.filter(f => filt === 'all' || (filt === 'open' ? f.status !== 'resolved' : f.status === 'resolved'));
  const kindPill = { issue: 'warn', question: 'info', idea: 'acc', approve: 'good' };
  if (S.fbReady && !S.db) { el.innerHTML = '<div class="hero"><div class="lbl">Feedback</div><h2>Notes on the designs</h2><p>Feedback is only available in the Claude-hosted copy of this hub.</p></div>'; return; }
  el.innerHTML = `<div class="hero"><div class="lbl">Feedback</div><h2>Notes on the designs</h2><p>Everything left here is stored with the hub, so the next working session can read it, act on it and reply. Pin feedback to a part by clicking it in the Board view first.</p></div>
   <div class="row"><div class="seg" id="fbFilt">${['open', 'resolved', 'all'].map(k => `<button type="button" data-k="${k}" aria-pressed="${k === filt}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div><button class="btn primary" type="button" id="fbAdd">New feedback</button></div>
   ${S.fbErr ? `<div class="note">The feedback store stopped answering (${esc(S.fbErr.code)}). Reload the page to reconnect.</div>` : ''}
   ${S.fbSlow ? '<div class="note">The feedback store has not answered yet; what is shown may be out of date.</div>' : ''}
   ${!S.fbReady ? '<div class="empty">Connecting to the feedback store…</div>' : list.length ? list.map(f => `<div class="fbitem"><div class="meta"><span class="pill ${kindPill[f.kind] || ''}">${esc(f.kind)}</span>${f.status === 'resolved' ? '<span class="pill good">resolved</span>' : ''}<b style="color:var(--ink)">${esc(f.target?.label || 'General')}</b>${f.rev ? '<span>' + esc(S.byId[f.rev]?.label || f.rev) + '</span>' : ''}<span>${esc(f.view || '')}</span><span class="mono">${esc((f.created || '').slice(0, 16).replace('T', ' '))}</span></div>
     <div class="txt">${esc(f.text)}</div>${f.reply ? `<div class="reply"><span class="lbl">Reply</span><br>${esc(f.reply)}</div>` : ''}
     <div class="row">${f.target?.type === 'part' ? `<button class="btn" type="button" data-open="${esc(f.id)}">Show ${esc(f.target.id)} in 3D</button>` : f.target?.type === 'doc' ? `<button class="btn" type="button" data-open="${esc(f.id)}">Open doc</button>` : f.target?.type === 'case' ? `<button class="btn" type="button" data-open="${esc(f.id)}">Open case</button>` : ''}
     ${S.db ? `<button class="btn" type="button" data-res="${esc(f.id)}">${f.status === 'resolved' ? 'Reopen' : 'Mark resolved'}</button>` : ''}</div></div>`).join('') : `<div class="empty">${filt === 'open' ? 'No open feedback. Click a part in the Board view and choose “Feedback on …”, or use “Leave feedback” at the top.' : 'Nothing here.'}</div>`}`;
  $$('#fbFilt button').forEach(b => b.onclick = () => { S.fbFilter = b.dataset.k; showFeedback(); });
  $('#fbAdd').onclick = () => openFeedback({ rev: null, view: 'feedback', target: { type: 'general', id: 'general', label: 'General' } });
  $$('[data-res]', el).forEach(b => b.onclick = async () => { const f = S.fb.find(x => x.id === b.dataset.res); b.disabled = true; try { await S.db.collection('feedback').doc(f.id).update({ status: f.status === 'resolved' ? 'open' : 'resolved' }); } catch (e) { toast('Could not update: ' + (e?.message || e?.code)); b.disabled = false; } });
  $$('[data-open]', el).forEach(b => b.onclick = () => { const f = S.fb.find(x => x.id === b.dataset.open);
    if (f.target.type === 'part') { S.cur = f.rev; store.set('rev', S.cur); go('board'); const t = setInterval(() => { if (B.data?.id === f.rev && B.data.partBy[f.target.id]) { clearInterval(t); selectPart(f.target.id, true); } }, 200); setTimeout(() => clearInterval(t), 15000); }
    else if (f.target.type === 'doc') go('docs', f.target.id); else if (f.target.type === 'case') go('case', f.target.id); });
}

window.__gea = { initFeedbackStore, B, S, C }; // lets a local test harness attach a stand-in store; inert on claude.ai
boot().catch(e => { console.error(e); $('#ovPage').innerHTML = `<div class="empty">The hub could not load its data (${esc(e.message)}).</div>`; });
</script>
