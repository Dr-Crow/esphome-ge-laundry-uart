# Rev1 candidate: generic 38-pin classic ESP32 interface, GEA3.
substitutions:
  name: rev1-classic-gea3
  upper_name: Rev1 Classic GEA3
  gea_tx_gpio: GPIO17
  gea_rx_gpio: GPIO16

esp32:
  board: nodemcu-32s
  variant: esp32
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source: github://mguaylam/esphome-gea@283ff2b0dfe90a6d14a5417a23176d433be8a5b3
    components: [gea]

packages:
  common: !include packages/common.yaml
  protocol: !include packages/gea3.yaml
