# Shared Rev3C carrier profile: XIAO ESP32-C6 + GEA2 appliance.
substitutions:
  name: rev3c-c6-gea2
  upper_name: Rev3C C6 GEA2
  esp32_board: seeed_xiao_esp32c6
  esp32_variant: esp32c6
  led_red_gpio: GPIO0
  led_red_ignore_strapping_warning: false
  led_green_gpio: GPIO1
  led_yellow_gpio: GPIO2
  gea_tx_gpio: GPIO21
  gea_rx_gpio: GPIO18
  c6_external_antenna: false

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source: github://mguaylam/esphome-gea@283ff2b0dfe90a6d14a5417a23176d433be8a5b3
    components: [gea]

packages:
  common: !include packages/common.yaml
  protocol: !include packages/gea2.yaml
  c6_rf: !include packages/c6-rf.yaml
