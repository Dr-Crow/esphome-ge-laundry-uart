# Shared Rev3C carrier profile: XIAO ESP32-C6 + GEA3 appliance.
substitutions:
  name: rev3c-c6-gea3
  upper_name: Rev3C C6 GEA3
  esp32_board: seeed_xiao_esp32c6
  esp32_variant: esp32c6
  led_red_gpio: GPIO0
  led_red_ignore_strapping_warning: false
  led_green_gpio: GPIO1
  led_yellow_gpio: GPIO2
  # Rev3D JP2: default 1-2 uses D6 (GPIO16, UART0 TX; prints ROM boot text at reset).
  # After cutting JP2 1-2 and bridging 2-3, use D4 instead: gea_tx_gpio: GPIO22
  gea_tx_gpio: GPIO16
  gea_rx_gpio: GPIO17
  c6_external_antenna: false

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source: github://mguaylam/esphome-gea@95cf5a6fa4b006b25533a4ce7a95cad749a740d4
    components: [gea]

packages:
  common: !include packages/common.yaml
  protocol: !include packages/gea3.yaml
  c6_rf: !include packages/c6-rf.yaml
