# Shared Rev3C carrier profile: XIAO ESP32-C3 + GEA2 appliance.
substitutions:
  name: rev3c-c3-gea2
  upper_name: Rev3C C3 GEA2
  esp32_board: seeed_xiao_esp32c3
  esp32_variant: esp32c3
  led_red_gpio: GPIO2
  led_red_ignore_strapping_warning: true
  led_green_gpio: GPIO3
  led_yellow_gpio: GPIO4
  gea_tx_gpio: GPIO5
  gea_rx_gpio: GPIO10

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source: github://mguaylam/esphome-gea@283ff2b0dfe90a6d14a5417a23176d433be8a5b3
    components: [gea]

packages:
  common: !include packages/common.yaml
  protocol: !include packages/gea2.yaml
