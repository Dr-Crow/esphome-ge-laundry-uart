# Shared services, diagnostics, and LED behavior for the Rev3C carrier.
# Per-profile substitutions and the GEA protocol package live in each profile.
esphome:
  name: ${name}
  min_version: 2026.9.1
  on_boot:
    - priority: 800
      then:
        - light.turn_off: led_red

logger:
  # Keep application logs off UART0, which is connected to the appliance bus
  # on some module variants. ESPHome logs remain available over the API/Wi-Fi.
  baud_rate: 0

api:
  on_client_connected:
    - delay: 1s
    - lambda: |-
        id(gea_hub).log_address();
        id(gea_hub).log_erds();

ota:
  password: !secret esp_home_ota_pw
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: uptime
    name: ${upper_name} Uptime
    entity_category: diagnostic

  - platform: wifi_signal
    name: ${upper_name} WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: template
    name: ${upper_name} GEA RX Bytes
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return id(gea_hub).get_rx_bytes();'
    update_interval: 30s

  - platform: template
    name: ${upper_name} GEA CRC Errors
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return id(gea_hub).get_crc_errors();'
    update_interval: 30s

  - platform: template
    name: ${upper_name} GEA TX Retries
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return id(gea_hub).get_tx_retries();'
    update_interval: 30s

  - platform: template
    name: ${upper_name} GEA Dropped Requests
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: 'return id(gea_hub).get_dropped_requests();'
    update_interval: 30s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${upper_name} IP
      entity_category: diagnostic

binary_sensor:
  - platform: template
    name: ${upper_name} GEA Bus Connected
    entity_category: diagnostic
    lambda: 'return id(gea_hub).is_bus_connected();'

button:
  - platform: restart
    name: ${upper_name} Restart

output:
  - platform: ledc
    pin:
      number: ${led_red_gpio}
      inverted: true
      ignore_strapping_warning: ${led_red_ignore_strapping_warning}
    id: led_red_output
    max_power: 0.04

  - platform: ledc
    pin:
      number: ${led_green_gpio}
      inverted: false
    id: led_green_output
    max_power: 0.04

  - platform: ledc
    pin:
      number: ${led_yellow_gpio}
      inverted: false
    id: led_yellow_output
    max_power: 0.06

light:
  - platform: monochromatic
    name: ${upper_name} Red LED
    id: led_red
    output: led_red_output
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: ${upper_name} Green LED
    id: led_green
    output: led_green_output
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: ${upper_name} Yellow LED
    id: led_yellow
    output: led_yellow_output
    restore_mode: ALWAYS_OFF

interval:
  - interval: 1s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on: led_green
          else:
            - light.turn_off: led_green

  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(gea_hub).is_bus_connected();'
          then:
            - light.turn_on: led_yellow
          else:
            - light.turn_off: led_yellow
