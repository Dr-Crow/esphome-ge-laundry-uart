# Shared Rev3C carrier profile: XIAO ESP32-C3 + GEA3 appliance.
substitutions:
  name: rev3c-c3-gea3
  upper_name: Rev3C C3 GEA3
  esp32_board: seeed_xiao_esp32c3
  esp32_variant: esp32c3
  led_red_gpio: GPIO2
  led_red_ignore_strapping_warning: true
  led_green_gpio: GPIO3
  led_yellow_gpio: GPIO4
  # Rev3D JP2: default 1-2 uses D6 (GPIO21, UART0 TX; prints ROM boot text at reset).
  # After cutting JP2 1-2 and bridging 2-3, use D4 instead: gea_tx_gpio: GPIO6
  gea_tx_gpio: GPIO21
  gea_rx_gpio: GPIO20

esp32:
  board: ${esp32_board}
  variant: ${esp32_variant}
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source: github://mguaylam/esphome-gea@95cf5a6fa4b006b25533a4ce7a95cad749a740d4
    components: [gea]

packages:
  common: !include packages/common.yaml
  protocol: !include packages/gea3.yaml
